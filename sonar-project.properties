# SonarQube Cloud analysis, run by the `sonar` job in .github/workflows/ci.yml.
# The keys must match the project created at https://sonarcloud.io/projects/create
# (default key for an imported GitHub repo is <org>_<repo>).
sonar.organization=fanfinity
sonar.projectKey=fanfinity_sfere-android-sdk
sonar.projectName=sfere-android-sdk

sonar.sources=sfere-analytics/src/main/kotlin
sonar.tests=sfere-analytics/src/test/kotlin
sonar.sourceEncoding=UTF-8

# Compiled classes help the Kotlin analyzer resolve types (the sonar job compiles first).
sonar.java.binaries=sfere-analytics/build/tmp/kotlin-classes/debug
sonar.java.test.binaries=sfere-analytics/build/tmp/kotlin-classes/debugUnitTest

# Coverage (JaCoCo XML from createDebugUnitTestCoverageReport) and the JUnit
# results of the same run, restored from the `test-results` artifact.
sonar.coverage.jacoco.xmlReportPaths=sfere-analytics/build/reports/coverage/test/debug/report.xml
sonar.junit.reportPaths=sfere-analytics/build/test-results/testDebugUnitTest

# The sample app and the mock server are test tooling, not the product.
sonar.exclusions=sample/**,tools/**,**/build/**

# Fail the job when the quality gate fails.
sonar.qualitygate.wait=true
