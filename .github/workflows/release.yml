name: release

# Publishes the SDK to Maven Central as io.sfere:analytics and cuts the GitHub
# release. Apps install it from mavenCentral() with no credentials.
#
# Trigger: a `vX.Y.Z` (or `vX.Y.Z-beta.N`) tag on a commit that is on main. Creating
# the tag is the privileged act: the "release-tags" ruleset lets only repository
# admins create `v*` tags, and the `release` environment accepts only `v*` refs.
# Required-reviewer gates are not available on this plan, so the tag ruleset is
# the gate.
#
# Flow: the same CI gate every pull request passes (ci.yml, via workflow_call) ->
# the tag must equal VERSION_NAME in gradle.properties and have a CHANGELOG section
# -> sign and upload io.sfere:analytics:VERSION to the Central Portal and wait
# until the Portal has validated it (seconds) -> check the signed files just
# uploaded -> GitHub release with the AAR, sources jar and POM attached and the
# CHANGELOG section as notes.
#
# The run does not wait for Central to finish publishing (usually 5-30 minutes,
# sometimes longer, outside our control): a validated deployment is released
# automatically. A developer confirms the version on Maven Central afterwards
# (docs/ci-cd.md, "Releasing").
#
# A version on Maven Central is permanent: it can never be deleted or replaced.
# To ship a fix, bump VERSION_NAME and tag again.
#
# Secrets (in the `release` environment): MAVEN_CENTRAL_USERNAME and
# MAVEN_CENTRAL_PASSWORD (a Central Portal user token for the io.sfere namespace),
# SIGNING_KEY (the ASCII-armored private GPG key) and SIGNING_KEY_PASSWORD.
# Developer-facing instructions: docs/ci-cd.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish to Maven Central
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # the GitHub release
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # "the tag is on main" is checked below

      - name: Resolve and check the version
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$TAG' is not vX.Y.Z or vX.Y.Z-pre.N."; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          PROP="$(sed -n 's/^VERSION_NAME=//p' gradle.properties | tr -d '[:space:]')"
          if [ "$PROP" != "$VERSION" ]; then
            echo "::error file=gradle.properties::Tag ${TAG} does not match VERSION_NAME=${PROP}. Set VERSION_NAME=${VERSION} on main first, then tag that commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${TAG} points at ${GITHUB_SHA::7}, which is not on main. Release only what went through a pull request."
            exit 1
          fi
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## [${VERSION}]' section. Rename '## [Unreleased]' to it (with the date) before tagging."
            exit 1
          fi
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          echo "VERSION=$VERSION"       >> "$GITHUB_ENV"
          echo "TAG=$TAG"               >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"
          echo "::notice::Releasing io.sfere:analytics:${VERSION} (prerelease=${PRERELEASE})."

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-read-only: true

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for v in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword \
                   ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            [ -n "${!v}" ] || { echo "::error::Secret for ${v#ORG_GRADLE_PROJECT_} is not set in the release environment."; exit 1; }
          done
          # publishToMavenLocal writes the same signed publication to ~/.m2, where the next
          # step checks it and the GitHub release takes its files from.
          ./gradlew :sfere-analytics:publishToMavenCentral :sfere-analytics:publishToMavenLocal --no-daemon

      # The files Central received: complete, signed, and the expected content.
      - name: Check the uploaded artifact
        run: |
          SRC="$HOME/.m2/repository/io/sfere/analytics/${VERSION}"
          OUT="$RUNNER_TEMP/release"
          mkdir -p "$OUT"
          for f in "analytics-${VERSION}.aar" "analytics-${VERSION}.pom" "analytics-${VERSION}-sources.jar" \
                   "analytics-${VERSION}-javadoc.jar" "analytics-${VERSION}.module"; do
            [ -s "$SRC/$f" ] || { echo "::error::$f is missing from the publication."; exit 1; }
            [ -s "$SRC/$f.asc" ] || { echo "::error::$f is not signed."; exit 1; }
            cp "$SRC/$f" "$OUT/"
          done
          unzip -p "$OUT/analytics-${VERSION}.aar" classes.jar > "$RUNNER_TEMP/classes.jar"
          unzip -l "$RUNNER_TEMP/classes.jar" | grep -q 'io/sfere/analytics/Sfere.class' \
            || { echo "::error::The published classes.jar has no io.sfere.analytics.Sfere."; exit 1; }
          grep -q "com.segment.analytics.kotlin" "$OUT/analytics-${VERSION}.pom" \
            || { echo "::error::The published POM does not declare the base library dependency."; exit 1; }
          AAR_SHA256="$(sha256sum "$OUT/analytics-${VERSION}.aar" | cut -d' ' -f1)"
          echo "AAR_SHA256=$AAR_SHA256" >> "$GITHUB_ENV"
          echo "::notice::io.sfere:analytics:${VERSION} validated by Central and released; it appears on repo1.maven.org once Central finishes publishing (sha256 ${AAR_SHA256})."

      - name: Release notes from the CHANGELOG
        run: |
          # The section for this version: from its heading to the next "## [" heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "## Install"
            echo
            echo "From Maven Central, no credentials needed (\`mavenCentral()\` is in the default repositories):"
            echo
            echo '```kotlin'
            echo "implementation(\"io.sfere:analytics:${VERSION}\")"
            echo '```'
            echo
            echo "AAR sha256 (the build uploaded to Maven Central, attached here): \`${AAR_SHA256}\`"
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "$TAG" "${ARGS[@]}" \
            "$RUNNER_TEMP/release/analytics-${VERSION}.aar" \
            "$RUNNER_TEMP/release/analytics-${VERSION}-sources.jar" \
            "$RUNNER_TEMP/release/analytics-${VERSION}.pom"
          {
            echo "### Released io.sfere:analytics:${VERSION}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${TAG}\` |"
            echo "| Package | https://central.sonatype.com/artifact/io.sfere/analytics/${VERSION} |"
            echo "| Release | https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG} |"
            echo "| AAR sha256 | \`${AAR_SHA256}\` |"
            echo
            echo "Central validated the deployment and is publishing it (usually 5-30 minutes). Confirm it is live:"
            echo
            echo '```sh'
            echo "curl -sI https://repo1.maven.org/maven2/io/sfere/analytics/${VERSION}/analytics-${VERSION}.pom | head -1   # HTTP/2 200"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
