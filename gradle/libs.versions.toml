[versions]
agp = "9.4.1"
kotlin = "2.0.21"
segment-analytics = "1.26.0"
kotlinx-serialization-json = "1.5.1"
kotlinx-coroutines = "1.7.1"
junit = "4.13.2"
okhttp = "4.12.0"
# Quality gates (CI runs them on every pull request; see docs/ci-cd.md).
ktlint-gradle = "12.3.0"
detekt = "1.23.8"
binary-compatibility-validator = "0.17.0"
# SonarQube Cloud scanner for Gradle, the setup SonarQube recommends for Gradle projects.
sonarqube = "7.5.0.8588"

[libraries]
segment-analytics-android = { module = "com.segment.analytics.kotlin:android", version.ref = "segment-analytics" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
