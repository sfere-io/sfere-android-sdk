# Memory caps: this machine runs several heavy jobs at once, so keep Gradle small.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle daemon: no separate Kotlin daemon to hold memory or to clean up.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The one place the SDK version lives. It becomes context.library.version on the
# wire, the release tag (vVERSION_NAME, which is also the JitPack version) and the
# Maven version of the io.sfere:analytics copy on GitHub Packages.
# A version that has been tagged is immutable: bump this before changing the SDK
# again (CI's "API contract" job enforces it), and add the CHANGELOG entry.
VERSION_NAME=0.1.0
GROUP=io.sfere
# AGP 9 compiles Kotlin itself by default ("built-in Kotlin"). The binary-compatibility
# validator (apiCheck/apiDump) only hooks into the org.jetbrains.kotlin.android plugin, and
# Kotlin's own ABI validation sees no classes under built-in Kotlin, so keep the separate
# plugin until one of them supports it.
android.builtInKotlin=false
android.newDsl=false
